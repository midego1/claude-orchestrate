<title>The Dispatch Floor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#d8d2af;
    --paper-hi:#e4dec1;
    --paper-lo:#cfc8a2;
    --ink:#27251a;
    --ink-soft:#5c5941;
    --accent:#a13a1e;
    --line-faint:rgba(39,37,26,.14);
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--mono);
    font-size:13px;
    line-height:1.55;
    overflow:hidden;
  }
  button{font-family:var(--mono);cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  mark{background:var(--ink);color:var(--paper-hi);padding:0 4px}

  #app{display:grid;grid-template-rows:auto 1fr;height:100vh}

  /* ── header: title block strip ─────────────────────────────── */
  header{
    display:flex;align-items:stretch;gap:0;
    border-bottom:1.5px solid var(--ink);
    background:var(--paper);
    overflow-x:auto;white-space:nowrap;flex-shrink:0;
  }
  .stat{padding:8px 18px 9px 14px;border-right:1px solid var(--line-faint)}
  .stat .k{font-size:9.5px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
  .stat .v{font-size:14px;margin-top:1px}
  .hdr-btns{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 14px}
  .hdr-btns button{
    background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);
    padding:6px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  }
  .hdr-btns button:hover{background:var(--ink);color:var(--paper-hi)}
  .hdr-btns button.armed{background:var(--ink);color:var(--paper-hi)}

  /* ── main 3-pane ───────────────────────────────────────────── */
  #main{display:grid;grid-template-columns:236px 1fr 384px;min-height:0}

  /* left index rail */
  #rail{border-right:1.5px solid var(--ink);overflow-y:auto;padding:10px 0 30px;background:var(--paper)}
  .grp{padding:12px 12px 2px;font-size:9.5px;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase}
  .row{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    background:none;border:none;border-left:3px solid transparent;
    padding:5px 10px 5px 11px;color:var(--ink);font-size:12px;
  }
  .row:hover{background:var(--paper-lo)}
  .row.sel{border-left-color:var(--accent);background:var(--paper-lo)}
  .row .cc{
    flex:none;width:26px;height:17px;border:1px solid var(--ink);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:9.5px;letter-spacing:.03em;background:var(--paper-hi);
  }
  .row.sel .cc,.row:hover .cc{background:var(--ink);color:var(--paper-hi)}
  .row .nm{flex:1;line-height:1.3}
  .row .md{flex:none;font-size:9px;color:var(--ink-soft)}

  /* canvas */
  #stage{position:relative;min-width:0;background:var(--paper);overflow:hidden}
  #stage svg{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #stage svg.panning{cursor:grabbing}
  #zoomer{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:5px}
  #zoomer button{width:26px;height:26px;border:1.5px solid var(--ink);background:var(--paper);font-size:14px;line-height:1}
  #zoomer button:hover{background:var(--ink);color:var(--paper-hi)}
  #hints{
    position:absolute;left:0;right:0;bottom:0;padding:6px 14px;
    font-size:10px;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;
    border-top:1px solid var(--line-faint);background:var(--paper);
    display:flex;gap:18px;overflow-x:auto;white-space:nowrap;
  }
  #tip{
    position:absolute;pointer-events:none;display:none;max-width:280px;
    background:var(--ink);color:var(--paper-hi);padding:7px 10px;font-size:11px;line-height:1.45;z-index:5;
  }
  #tip b{display:block;font-size:11px;letter-spacing:.05em}

  /* right reading panel */
  #panel{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0;background:var(--paper)}
  #tabs{display:flex;flex-shrink:0;border-bottom:1.5px solid var(--ink)}
  #tabs button{
    flex:1;padding:9px 4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    background:var(--paper);border:none;border-right:1px solid var(--line-faint);color:var(--ink-soft);
  }
  #tabs button.on{background:var(--ink);color:var(--paper-hi)}
  #pbody{overflow-y:auto;padding:18px 20px 40px}
  #pbody h1{font-size:21px;font-weight:600;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
  #pbody .eyebrow{font-size:9.5px;letter-spacing:.18em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px}
  #pbody .sub{color:var(--ink-soft);font-size:12px;margin-top:4px}
  #pbody h2{
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
    border-bottom:1px solid var(--ink);padding-bottom:4px;margin:22px 0 10px;font-weight:600;
  }
  #pbody p{margin:0 0 12px;max-width:62ch}
  #pbody table{width:100%;border-collapse:collapse;font-size:11.5px;margin:0 0 12px}
  #pbody td{border-top:1px solid var(--line-faint);padding:5px 8px 5px 0;vertical-align:top}
  #pbody td:first-child{color:var(--ink-soft);white-space:nowrap;padding-right:12px}
  #pbody code{background:var(--paper-lo);padding:1px 4px;font-size:11px}
  .nodehead{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
  .nodehead .cc{
    flex:none;min-width:32px;height:24px;padding:0 5px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper-hi);
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;margin-top:3px;
  }
  .backlink{background:none;border:none;color:var(--ink-soft);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:0;margin-bottom:14px;text-decoration:underline}
  .backlink:hover{color:var(--accent)}
  .stepnav{display:flex;gap:8px;margin-top:16px}
  .stepnav button{border:1.5px solid var(--ink);background:var(--paper);padding:6px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .stepnav button:hover:not(:disabled){background:var(--ink);color:var(--paper-hi)}
  .stepnav button:disabled{opacity:.35;cursor:default}
  .stepct{font-size:10px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:6px}
  .modeline{font-size:10.5px;color:var(--ink-soft);border:1px dashed var(--ink-soft);padding:6px 9px;margin:0 0 14px}

  /* ── SVG map styling ───────────────────────────────────────── */
  .gridline{stroke:var(--line-faint);stroke-width:1}
  .region{fill:none;stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:2 4}
  .glabel{font-size:10px;letter-spacing:.2em;fill:var(--ink-soft);text-transform:uppercase}
  .edge path{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
  .edge.fb path{stroke:var(--ink-soft);stroke-width:1.1;stroke-dasharray:5 4}
  .edge .joint{fill:var(--ink)}
  .edge.fb .joint{fill:var(--ink-soft)}
  .edge.hi path{stroke:var(--accent);stroke-width:2}
  .edge.hi .joint{fill:var(--accent)}
  .elabel{font-size:9.5px;fill:var(--ink-soft);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .edge.hi + g .elabel{fill:var(--accent)}
  .node{cursor:pointer}
  .node polygon{stroke:var(--ink);stroke-width:1;stroke-linejoin:round}
  .f-top{fill:var(--paper-hi)}
  .f-l{fill:var(--paper)}
  .f-r{fill:var(--paper-lo)}
  .h-l{fill:url(#hL)}
  .h-r{fill:url(#hR)}
  .h-t{fill:none}
  .node .chip rect{fill:var(--paper-hi);stroke:var(--ink);stroke-width:1.2}
  .node .chip text{font-size:10.5px;fill:var(--ink);letter-spacing:.02em}
  .node.hi polygon,.node.sel polygon{stroke-width:1.7}
  .node.hi .chip rect,.node.sel .chip rect{fill:var(--ink)}
  .node.hi .chip text,.node.sel .chip text{fill:var(--paper-hi)}
  .node.sel .f-top{stroke:var(--accent);stroke-width:2}
  .dimmed{opacity:.16}
  .pulse{fill:var(--accent)}
  svg text{font-family:var(--mono);user-select:none}

  @media (max-width:1080px){
    body{overflow:auto}
    #app{height:auto;grid-template-rows:auto auto}
    #main{grid-template-columns:1fr;grid-template-rows:62vh auto}
    #rail{display:none}
    #stage{border-bottom:1.5px solid var(--ink)}
    #panel{border-left:none;max-height:none}
    #pbody{max-height:none}
  }
</style>

<div id="app">
  <header>
    <div class="stat"><div class="k">Repository</div><div class="v">claude-orchestrate · v0.5.4</div></div>
    <div class="stat"><div class="k">Agent roles</div><div class="v">3 + your session</div></div>
    <div class="stat"><div class="k">Model tiers</div><div class="v">4 · T0–T3</div></div>
    <div class="stat"><div class="k">Gates</div><div class="v">3 + ship gate</div></div>
    <div class="stat"><div class="k">Retry budget</div><div class="v">3 / unit</div></div>
    <div class="stat"><div class="k">Global cap</div><div class="v">3× units</div></div>
    <div class="hdr-btns">
      <button id="btnFlow">▶ Pause the flow</button>
      <button id="btnTrace">Trace one step</button>
      <button id="btnReset">Reset view</button>
    </div>
  </header>

  <div id="main">
    <nav id="rail" aria-label="Component index"></nav>

    <div id="stage">
      <svg id="map" role="img" aria-label="Isometric map of the claude-orchestrate protocol: an orchestrator decomposes a task into a routing plan, a foreman dispatches tiered workers in isolated worktrees, three verification gates and a ship gate check everything with evidence, and run state lives on disk in a checkpoint and archive."></svg>
      <div id="zoomer"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
      <div id="tip"></div>
      <div id="hints">
        <span>hover to read</span><span>click to pin</span><span>drag to pan</span><span>scroll to zoom</span><span>height = model cost · dashed = feedback</span>
      </div>
    </div>

    <aside id="panel">
      <div id="tabs">
        <button id="tabWhat" class="on">What it does</button>
        <button id="tabHow">How it's built</button>
      </div>
      <div id="pbody"></div>
    </aside>
  </div>
</div>

<script>
'use strict';
/* ───────────────────────── data ───────────────────────── */

const NODES=[
 // PLAN
 {id:'you',code:'Y',name:'You — the session',grp:'plan',model:'—',x:0,y:3,w:1.1,d:1.1,h:.7,
  hover:'One routing table before any spend; one STATE line per foreman turn after that.',
  meta:[['role','approves the plan, receives the result'],['sees','routing table · STATE lines · final report']],
  body:['You hand the session a substantive task — one that splits into more than ~3 independent units, spans several files, or benefits from parallel workers. Trivial turns skip all of this by design: orchestration overhead would exceed the task.',
        'Before anything is spent you see the full routing plan as one table — every unit, its tier, model, effort, isolation, verifier, and retry counter — and you can veto it. After that, progress arrives as a single STATE line per foreman turn, never as tables through your expensive context. At the end: what shipped and what’s parked.']},
 {id:'orch',code:'O',name:'Orchestrator',grp:'plan',model:'fable @ xhigh',x:2.4,y:1.6,w:2,d:2,h:2.7,
  hover:'The session model. Decomposes, classifies, routes, integrates — and never reads files.',
  meta:[['model','your session model — Fable 5 @ xhigh recommended'],['source','skills/orchestrate/SKILL.md'],['keeps for itself','plan · routing · escalation calls · semantic merges · the decision to ship']],
  body:['The model you select in Claude Code is the orchestrator. Its whole job is judgment: decompose the task into units with machine-checkable done-criteria, classify each into a tier (T0–T3), announce the plan, and integrate what comes back. A bad plan at the top causes escalation cascades below — which is why the frontier model sits here and nowhere else.',
        'Its tokens are the most expensive in the system, and everything it reads is re-processed on every later turn. So it never reads files or raw logs: readers summarize instead (haiku for targeted extraction, sonnet for open-ended comprehension), every dispatch caps its return size, and failure histories arrive compressed.']},
 {id:'plan',code:'P',name:'Routing plan',grp:'plan',model:'one table',x:5.6,y:1.7,w:2,d:1.7,h:.35,kind:'slab',
  hover:'The canonical table — unit · tier · model · effort · isolation · verifier · dispatches — announced before anything runs.',
  meta:[['budget','3 dispatches per unit · global cap 3× unit count'],['maps 1:1','onto checkpoint.json’s units array']],
  body:['Nothing dispatches before the table is announced. One row per unit — tier, model, effort, worktree isolation, which verifier guards it, and a 0/3 dispatch counter — plus one cap line naming the global budget, the foreman, and the integration branch.',
        'The table maps one-to-one onto the run’s checkpoint.json, so the plan you approved and the state a crashed run recovers from are the same thing. The verifier column is where the security guarantee lives: critical units always get the deep verifier; mechanical ones ride the ship-gate review as named spot-checks instead.']},
 // EXECUTE
 {id:'pre',code:'PF',name:'Capability preflight',grp:'exec',model:'1 real call',x:8.5,y:1.7,w:1.2,d:1.2,h:1,
  hover:'The foreman’s first tool action: one real Agent call proving it can spawn workers at all.',
  meta:[['the test','haiku, “reply OK”, synchronous'],['on failure','foreman becomes a planner; orchestrator runs DIRECT mode']],
  body:['Harness capability changes between sessions — a foreman that dispatched dozens of workers yesterday may get “No such tool available: Agent” today. So the foreman’s first tool action is one trivial real dispatch. Tool availability is tested by calling, not searching: a field foreman once “proved” the Agent tool missing via exhaustive ToolSearch queries; only the real call produced the real error.',
        'If the call fails, the foreman fakes nothing: it becomes a planner — writes every dispatch contract and the final-gate runbook to disk, marks the checkpoint DIRECT, and hands the loop to the orchestrator. Direct mode skips the foreman, never the gates.']},
 {id:'fore',code:'F',name:'Foreman',grp:'exec',model:'opus @ high',x:7.7,y:4.5,w:2,d:2,h:2,
  hover:'Execution manager: dispatch loop, gates, triage, retries — keeps the frontier model out of the loop.',
  meta:[['model','opus @ high'],['source','agents/foreman.md'],['used for','plans of 6+ units — 5 or fewer run direct'],['authority','resolves spec + env failures itself; T2+ escalations go up']],
  body:['The foreman receives the approved plan and runs the loop so the expensive model doesn’t have to: dispatch synchronous parallel waves, run Gate 1 itself, dispatch Gate 2 verifiers, triage failures, manage retries inside the budget, and merge passed units back one at a time. Workers are always synchronous Agent calls issued in a single message — a sub-agent’s background children stop notifying it the moment it idles, so background worker dispatch is forbidden.',
        'Every visible turn ends with a STATE line carrying a terminal token — STOPPED-AWAITING-RESUME or COMPLETED — because a foreman notification always means it stopped: there is no notification for “still working.” A round-end report once read as “still running” cost a field run 16 idle minutes, then 43.']},
 {id:'wt',code:'WT',name:'Isolated worktrees',grp:'exec',model:'git',x:10.9,y:1.2,w:2.7,d:7,h:.28,kind:'platform',chip:[.25,6.7],
  hover:'Every writer gets a worktree forked at the exact baseline SHA — parallel work without collisions.',
  meta:[['baseline','git worktree add <path> <baselineSha> — manual, never from a drifted HEAD'],['worker’s first move','git merge-base --is-ancestor check; mismatch → stop, don’t improvise'],['fallback','shared tree: max 2–3 writers, disjoint scopes, scoped git add only']],
  body:['File-mutating workers run in git worktrees created at the exact baseline commit. Each worker verifies its own base before touching anything and fails fast rather than improvising a branch; it commits granularly and returns branch + SHA, not just file paths.',
        'Where isolation isn’t available, concurrent writers share the tree under a hard hygiene rule — scoped git add <path> only, never git add -A or git stash (a field worker’s bare stash once swept a concurrent worker’s uncommitted changes into an orphan stash) — with a ceiling of 2–3 writers and a full tree audit after every wave.']},
 {id:'w0',code:'T0',name:'T0 workers — haiku',grp:'exec',model:'haiku',x:11.5,y:1.9,w:1.4,d:1.4,h:.7,base:.28,
  hover:'Mechanical volume: lookups, fan-out reads, boilerplate, exact-spec edits.',
  meta:[['tier','T0 — mechanical'],['reader rule','targeted, checkable questions only — haiku’s failure mode is silent omission']],
  body:['The cheapest tier does the volume: file and symbol lookups, grep-style exploration, fan-out reads across dozens of files, renaming, formatting, boilerplate, exact-spec single-file edits, and criteria-checkable verification.',
        'Routing heuristic: if the spec is so precise that correctness is mechanically checkable, drop the unit a tier. Targeted questions go to haiku; open-ended comprehension goes to sonnet — haiku’s failure mode as a reader is silent omission, the expensive kind.']},
 {id:'w1',code:'T1',name:'T1 workers — sonnet',grp:'exec',model:'sonnet',x:11.5,y:4.1,w:1.4,d:1.4,h:1.3,base:.28,
  hover:'Standard implementation from a clear spec: features, tests, docs, small refactors.',
  meta:[['tier','T1 — standard'],['cheap lever','sonnet @ xhigh often matches opus @ high at a fraction of the cost']],
  body:['Sonnet takes implementation from a clear spec: features, tests, bug fixes with a known root cause, docs, refactors scoped to one to three files, API integration following an existing pattern.',
        'Effort is a second, cheaper lever than model choice — bump effort before model. Target distribution across a plan: roughly 60% T0/T1, 35% T2, ≤5% T3 — a guideline for spotting under-specified plans, not a quota.']},
 {id:'w2',code:'T2',name:'T2 workers — opus',grp:'exec',model:'opus',x:11.5,y:6.3,w:1.4,d:1.4,h:2,base:.28,
  hover:'Cross-file refactors, root-cause hunts, security-sensitive code.',
  meta:[['tier','T2 — complex'],['T3 above it','fable — rare; usually the orchestrator IS the frontier tier']],
  body:['Opus takes what needs breadth: multi-file refactors holding cross-file context, root-cause investigation of non-obvious bugs, critical-path review, migration planning, concurrency logic, and anything security-sensitive — code touching credentials is routed up-tier by design, never asked of a cheap model.',
        'A T3 (fable) tier exists for units needing long autonomous investigation under unclear constraints, but it’s rare: usually the orchestrator itself is the frontier reasoning and T2 suffices below it.']},
 // VERIFY
 {id:'g1',code:'G1',name:'Gate 1 — mechanical',grp:'verify',model:'bash · ~free',x:11.2,y:9.8,w:2.5,d:2.3,h:.4,kind:'slab',
  hover:'Tests, build, lint, diff scope, reachability greps. Go/no-go gates run with caches cleared.',
  meta:[['checks','exact test cmd · build · lint · diff vs baseline · e2e where possible'],['reachability','new code must be imported AND init-wired — tests pass on dead code'],['cold rule','go/no-go gates clear .turbo, dist, .cache, *tsbuildinfo* first']],
  body:['The first gate is free and decisive: run the actual done-criteria as bash — the exact test command, the build, lint, a diff-scope check against the recorded baseline. For UI units, a grep proving each new component is imported by a route-reachable file; for stateful modules, that their init hook is invoked from the composition root — a field outbox once passed every import grep while its drain loop sat dead in production.',
        'Authoritative gates run cold: cached lint output is actively misleading, not just stale — a field run’s error count swung between 40 and 1800 with cache freshness, burying the 2 real errors and propagating a wrong diagnosis into several dispatch prompts.']},
 {id:'vf',code:'V1',name:'verifier-fast',grp:'verify',model:'haiku',x:15.1,y:9.6,w:1.2,d:1.2,h:.7,
  hover:'PASS/FAIL per criterion, cited evidence required. “Looks correct” is a FAIL.',
  meta:[['model','haiku'],['source','agents/verifier-fast.md'],['output','one line per criterion: PASS|FAIL — evidence: …']],
  body:['For output that can’t be mechanically checked, a cheap independent verifier compares it against the done-criteria — one line per criterion, each with cited evidence: specific test output, line numbers, diff hunks. A verdict without evidence is a FAIL by rule; so is “looks correct.”',
        'Verifiers are read-only and never take the worker’s own claims as evidence. The routing rule: a verifier runs one tier below its producer, floor at haiku — verifying against a good spec is cheaper than producing.']},
 {id:'vd',code:'V2',name:'verifier-deep',grp:'verify',model:'sonnet @ xhigh',x:15,y:11.5,w:1.5,d:1.5,h:1.3,
  hover:'For judgment calls — also reports what’s MISSING relative to the spec.',
  meta:[['model','sonnet @ xhigh'],['source','agents/verifier-deep.md'],['extra output','MISSING lines — defects the criteria don’t cover']],
  body:['Security- and correctness-critical output gets the deep verifier: the same evidence-per-criterion contract, plus a dedicated output slot for what the criteria don’t cover — MISSING lines naming unhandled edge cases, symptom patches masquerading as root-cause fixes, semantically inequivalent rewrites.',
        'This is where the guarantee lives, and it’s rationed deliberately under the global cap: critical units always get it; mechanical units ride the ship-gate review as named spot-checks instead — skips must surface somewhere, never silently.']},
 {id:'tri',code:'X',name:'Failure triage',grp:'verify',model:'foreman logic',x:7.9,y:9.9,w:1.6,d:1.6,h:1.1,
  hover:'Most failures aren’t capability failures. Spec → rewrite. Env → fix. Only then escalate — one step.',
  meta:[['order','spec → environment → capability → verifiability gap'],['budget','3 dispatches per unit, hard · re-decompose grants fresh budget once'],['escalation','one step: effort first, then model — never a ladder']],
  body:['Before any escalation the foreman triages in strict order. Spec failure (a competent human would need a clarifying question) → rewrite the dispatch, retry the same tier — escalating a bad spec buys an expensive wrong answer. Environment failure (flaky test, missing dep, stale state; unclear cases default here) → fix it, retry same tier. Only with a clean spec and a clean environment is it a capability failure — escalate one step, effort before model.',
        'The fourth verdict is the subtle one: a verifiability gap, where the repo’s test infrastructure structurally can’t exercise the failure mode. Escalating buys another equally unverifiable attempt — instead, ship the verifiable subset and surface the rest, naming the missing test infra.']},
 {id:'mrg',code:'M',name:'Integrate',grp:'verify',model:'sequential',x:10.9,y:13.5,w:1.8,d:1.7,h:.9,
  hover:'Passed units merge back one at a time; Gate 1 re-runs after every merge.',
  meta:[['order','sequential, never batch'],['per merge','Gate 1 re-run — caches cleared on go/no-go'],['conflicts','semantic resolution goes up to the orchestrator']],
  body:['Gate-passed branches merge back into the integration branch one at a time, with mechanical checks re-run after each merge — two units that each pass alone can still break together, and a batch merge can’t tell you which one did it.',
        'Merge conflicts aren’t resolved by the foreman: semantic conflict resolution is orchestrator judgment. When parallel units extend an ordered registry (a migration journal, an enum), same-slot claims are expected — resolved by keep-both + renumber.']},
 {id:'g3',code:'G3',name:'Gate 3 — orchestrator',grp:'verify',model:'session model',x:7.3,y:13.8,w:1.6,d:1.6,h:1.6,
  hover:'Cross-unit consistency. One PASS line per unit, each with an evidence reference.',
  meta:[['checks','cross-unit consistency + integration — not unit-level correctness'],['rule','a PASS line without its evidence reference is a FAIL, foreman summaries included']],

/* ───────────────────────── iso rendering ───────────────────────── */

const TW=44,TH=22,ZH=26;
const iso=(x,y,z=0)=>[(x-y)*TW,(x+y)*TH-z*ZH];
const pt=p=>p[0].toFixed(1)+','+p[1].toFixed(1);
const poly=(pts,cls)=>`<polygon class="${cls}" points="${pts.map(pt).join(' ')}"/>`;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

function faceSet(x,y,w,d,z0,h,hatch){
  const t=[iso(x,y,z0+h),iso(x+w,y,z0+h),iso(x+w,y+d,z0+h),iso(x,y+d,z0+h)];
  const r=[iso(x+w,y,z0+h),iso(x+w,y+d,z0+h),iso(x+w,y+d,z0),iso(x+w,y,z0)];
  const l=[iso(x,y+d,z0+h),iso(x+w,y+d,z0+h),iso(x+w,y+d,z0),iso(x,y+d,z0)];
  let s=poly(l,'f-l')+poly(r,'f-r')+poly(t,'f-top');
  if(hatch){s+=poly(l,'h-l')+poly(r,'h-r');}
  return s;
}

function nodeSvg(n){
  const base=n.base||0;
  let s=`<g class="node" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.name)}">`;
  if(n.kind==='stack'){
    const sh=.22,gap=.15;
    for(let i=0;i<5;i++) s+=faceSet(n.x,n.y,n.w,n.d,base+i*(sh+gap),sh,true);
    n._topz=base+5*(sh+gap);
  }else{
    s+=faceSet(n.x,n.y,n.w,n.d,base,n.h,n.kind!=='slab'&&n.kind!=='platform');
    n._topz=base+n.h;
  }
  const co=n.chip?[n.x+n.chip[0],n.y+n.chip[1]]:[n.x+n.w/2,n.y+n.d/2];
  const c=iso(co[0],co[1],n._topz);
  s+=`<g class="chip"><rect x="${(c[0]-11).toFixed(1)}" y="${(c[1]-9).toFixed(1)}" width="22" height="18"/>`+
     `<text x="${c[0].toFixed(1)}" y="${(c[1]+4).toFixed(1)}" text-anchor="middle">${n.code}</text></g></g>`;
  return s;
}

function edgeSvg(e){
  const scr=e.pts.map(p=>iso(p[0],p[1]));
  const d='M'+scr.map(pt).join('L');
  let s=`<g class="edge ${e.kind}" data-id="${e.id}"><path d="${d}" marker-end="url(#arr${e.kind==='fb'?'F':'M'})"/>`;
  for(let i=1;i<scr.length-1;i++){
    const[cx,cy]=scr[i];
    s+=`<polygon class="joint" points="${cx},${cy-3.4} ${cx+3.4},${cy} ${cx},${cy+3.4} ${cx-3.4},${cy}"/>`;
  }
  s+='</g>';
  if(e.label){
    const l=iso(e.lab[0],e.lab[1]);
    s+=`<g><text class="elabel" x="${l[0].toFixed(1)}" y="${l[1].toFixed(1)}" text-anchor="middle">${esc(e.label)}</text></g>`;
  }
  // precompute polyline for pulses
  e._scr=scr;e._cum=[0];
  for(let i=1;i<scr.length;i++){
    e._cum.push(e._cum[i-1]+Math.hypot(scr[i][0]-scr[i-1][0],scr[i][1]-scr[i-1][1]));
  }
  e._len=e._cum[e._cum.length-1];
  return s;
}

function edgePoint(e,dist){
  const c=e._cum;
  for(let i=1;i<c.length;i++){
    if(dist<=c[i]){
      const f=(dist-c[i-1])/((c[i]-c[i-1])||1);
      return [e._scr[i-1][0]+(e._scr[i][0]-e._scr[i-1][0])*f, e._scr[i-1][1]+(e._scr[i][1]-e._scr[i-1][1])*f];
    }
  }
  return e._scr[e._scr.length-1];
}

function buildMap(){
  let defs=`<defs>
    <pattern id="hL" width="5.5" height="5.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5.5" stroke="rgba(39,37,26,.42)" stroke-width=".8"/></pattern>
    <pattern id="hR" width="5.5" height="5.5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="5.5" stroke="rgba(39,37,26,.30)" stroke-width=".8"/></pattern>
    <marker id="arrM" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.6 L7,4 L0,7.4 Z" fill="var(--ink)"/></marker>
    <marker id="arrF" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.6 L7,4 L0,7.4 Z" fill="var(--ink-soft)"/></marker>
  </defs>`;

  let grid='<g aria-hidden="true">';
  for(let gx=-2;gx<=20;gx+=2){const a=iso(gx,-2),b=iso(gx,17);grid+=`<line class="gridline" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;}
  for(let gy=-2;gy<=16;gy+=2){const a=iso(-2,gy),b=iso(20,gy);grid+=`<line class="gridline" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;}
  grid+='</g>';

  let regions='<g aria-hidden="true">';
  for(const r of REGIONS){
    regions+=`<polygon class="region" points="${r.pts.map(p=>pt(iso(p[0],p[1]))).join(' ')}"/>`;
    const l=iso(r.lab[0],r.lab[1]);
    regions+=`<text class="glabel" x="${l[0]}" y="${l[1]}">${esc(r.label)}</text>`;
  }
  for(const g of GLABELS){
    const l=iso(g.pos[0],g.pos[1]);
    regions+=`<text class="glabel" x="${l[0]}" y="${l[1]}">${g.t}</text>`;
  }
  regions+='</g>';

  const edges='<g id="edges">'+EDGES.map(edgeSvg).join('')+'</g>';

  const sorted=[...NODES].sort((a,b)=>{
    const la=a.kind==='platform'?-1:0, lb=b.kind==='platform'?-1:0;
    if(la!==lb)return la-lb;
    return (a.x+a.y+a.w+a.d)-(b.x+b.y+b.w+b.d);
  });
  const blocks='<g id="blocks">'+sorted.map(nodeSvg).join('')+'</g>';

  return defs+`<g id="world">`+grid+regions+edges+`<g id="pulses" aria-hidden="true"></g>`+blocks+`</g>`;
}

function fitView(){
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  const consider=p=>{mnx=Math.min(mnx,p[0]);mxx=Math.max(mxx,p[0]);mny=Math.min(mny,p[1]);mxy=Math.max(mxy,p[1]);};
  for(const n of NODES){consider(iso(n.x,n.y+n.d,0));consider(iso(n.x+n.w,n.y,0));consider(iso(n.x,n.y,(n._topz||n.h||1)));consider(iso(n.x+n.w,n.y+n.d,0));}
  for(const e of EDGES)e._scr.forEach(consider);
  mnx-=70;mny-=60;mxx+=70;mxy+=60;
  const r=svg.getBoundingClientRect();
  const k=Math.min(r.width/(mxx-mnx),r.height/(mxy-mny));
  view={k,x:-mnx*k+(r.width-(mxx-mnx)*k)/2,y:-mny*k+(r.height-(mxy-mny)*k)/2};
  home={...view};
  applyView();
}

/* pan + zoom */
let drag=null;
svg.addEventListener('pointerdown',ev=>{
  drag={sx:ev.clientX,sy:ev.clientY,vx:view.x,vy:view.y,moved:false};
  svg.setPointerCapture(ev.pointerId);svg.classList.add('panning');
});
svg.addEventListener('pointermove',ev=>{
  if(!drag)return;
  const dx=ev.clientX-drag.sx,dy=ev.clientY-drag.sy;
  if(Math.hypot(dx,dy)>4)drag.moved=true;
  view.x=drag.vx+dx;view.y=drag.vy+dy;applyView();
});
svg.addEventListener('pointerup',ev=>{
  svg.classList.remove('panning');
  const moved=drag&&drag.moved;drag=null;
  if(moved)return;
  const g=ev.target.closest?ev.target.closest('.node'):null;
  if(g)select(g.dataset.id);else if(selId){select(null);}
});
svg.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const r=svg.getBoundingClientRect();
  const mx=ev.clientX-r.left,my=ev.clientY-r.top;
  const f=Math.exp(-ev.deltaY*0.0012);
  const k2=Math.min(3.2,Math.max(.3,view.k*f)),real=k2/view.k;
  view.x=mx-(mx-view.x)*real;view.y=my-(my-view.y)*real;view.k=k2;applyView();
},{passive:false});
function zoomBy(f){
  const r=svg.getBoundingClientRect();
  const mx=r.width/2,my=r.height/2;
  const k2=Math.min(3.2,Math.max(.3,view.k*f)),real=k2/view.k;
  view.x=mx-(mx-view.x)*real;view.y=my-(my-view.y)*real;view.k=k2;applyView();
}
document.getElementById('zin').onclick=()=>zoomBy(1.25);
document.getElementById('zout').onclick=()=>zoomBy(.8);

/* hover */
for(const[id,el]of Object.entries(nodeEls)){
  el.addEventListener('pointerenter',()=>{el.classList.add('hi');railRow(id)?.classList.add('sel');showTip(id);if(!selId&&traceIdx<0)renderNode(id,true);});
  el.addEventListener('pointerleave',()=>{if(id!==selId){el.classList.remove('hi');railRow(id)?.classList.remove('sel');}hideTip();if(!selId&&traceIdx<0)renderPanel();});
  el.addEventListener('pointermove',ev=>moveTip(ev));
  el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(id);}});
}
function showTip(id){const n=nodeById[id];tip.innerHTML=`<b>${n.code} · ${esc(n.name)}</b>${esc(n.hover)}`;tip.style.display='block';}
function hideTip(){tip.style.display='none';}
function moveTip(ev){
  const r=svg.getBoundingClientRect();
  let x=ev.clientX-r.left+14,y=ev.clientY-r.top+14;
  if(x>r.width-300)x-=320;if(y>r.height-110)y-=130;
  tip.style.left=x+'px';tip.style.top=y+'px';
}

/* selection */
function select(id){
  if(traceIdx>=0)exitTrace();
  if(selId&&nodeEls[selId]){nodeEls[selId].classList.remove('sel','hi');railRow(selId)?.classList.remove('sel');}
  selId=(id===selId)?null:id;
  if(selId){nodeEls[selId].classList.add('sel');railRow(selId)?.classList.add('sel');renderNode(selId,false);}
  else renderPanel();
}
function railRow(id){return document.querySelector(`.row[data-id="${id}"]`);}

/* sidebar */
(function buildRail(){
  const rail=document.getElementById('rail');
  let h='';
  for(const g of GROUPS){
    h+=`<div class="grp">${g.label}</div>`;
    for(const n of NODES.filter(n=>n.grp===g.id)){
      h+=`<button class="row" data-id="${n.id}"><span class="cc">${n.code}</span><span class="nm">${esc(n.name)}</span><span class="md">${esc(n.model)}</span></button>`;
    }
  }
  rail.innerHTML=h;
  rail.querySelectorAll('.row').forEach(b=>{
    const id=b.dataset.id;
    b.addEventListener('mouseenter',()=>{nodeEls[id].classList.add('hi');if(!selId&&traceIdx<0)renderNode(id,true);});
    b.addEventListener('mouseleave',()=>{if(id!==selId)nodeEls[id].classList.remove('hi');if(!selId&&traceIdx<0)renderPanel();});
    b.addEventListener('click',()=>select(id));
  });
})();

/* ───────────────────────── panel rendering ───────────────────────── */

function renderPanel(){
  document.getElementById('tabWhat').classList.toggle('on',tab==='what');
  document.getElementById('tabHow').classList.toggle('on',tab==='how');
  pbody.innerHTML=tab==='what'?OVERVIEW_WHAT:OVERVIEW_HOW;
  pbody.scrollTop=0;
}

function renderNode(id,preview){
  const n=nodeById[id];
  let h='';
  if(!preview)h+=`<button class="backlink" id="backBtn">← back to overview</button>`;
  h+=`<div class="nodehead"><span class="cc">${n.code}</span><div><h1 style="font-size:18px">${esc(n.name)}</h1><p class="sub">${esc(n.hover)}</p></div></div>`;
  h+='<h2>Spec</h2><table>'+n.meta.map(m=>`<tr><td>${esc(m[0])}</td><td>${esc(m[1])}</td></tr>`).join('')+'</table>';
  h+='<h2>What it does</h2>'+n.body.map(p=>`<p>${esc(p)}</p>`).join('');
  pbody.innerHTML=h;
  if(!preview)document.getElementById('backBtn').onclick=()=>select(null);
  pbody.scrollTop=0;
}

document.getElementById('tabWhat').onclick=()=>{tab='what';if(selId)select(null);else if(traceIdx>=0)exitTrace();renderPanel();};
document.getElementById('tabHow').onclick=()=>{tab='how';if(selId)select(null);else if(traceIdx>=0)exitTrace();renderPanel();};

/* ───────────────────────── trace mode ───────────────────────── */

function applyTrace(){
  const st=STEPS[traceIdx];
  const nset=new Set(st.n),eset=new Set(st.e);
  for(const[id,el]of Object.entries(nodeEls))el.classList.toggle('dimmed',!nset.has(id)),el.classList.toggle('hi',nset.has(id));
  for(const[id,el]of Object.entries(edgeEls))el.classList.toggle('dimmed',!eset.has(id)),el.classList.toggle('hi',eset.has(id));
  let h=`<div class="stepct">Trace · step ${traceIdx+1} / ${STEPS.length}</div><h1 style="font-size:18px">${esc(st.t)}</h1>`;
  h+=`<p style="margin-top:10px">${esc(st.x)}</p>`;
  h+=`<div class="stepnav">
        <button id="stPrev" ${traceIdx===0?'disabled':''}>← prev</button>
        <button id="stNext">${traceIdx===STEPS.length-1?'finish':'next →'}</button>
        <button id="stExit">exit</button>
      </div>
      <p class="sub" style="margin-top:12px">←/→ keys work too</p>`;
  pbody.innerHTML=h;
  document.getElementById('stPrev').onclick=()=>{if(traceIdx>0){traceIdx--;applyTrace();}};
  document.getElementById('stNext').onclick=()=>{traceIdx<STEPS.length-1?(traceIdx++,applyTrace()):exitTrace();};
  document.getElementById('stExit').onclick=exitTrace;
}
function enterTrace(){
  if(selId)select(null);
  traceIdx=0;
  document.getElementById('btnTrace').classList.add('armed');
  applyTrace();
}
function exitTrace(){
  traceIdx=-1;
  document.getElementById('btnTrace').classList.remove('armed');
  for(const el of Object.values(nodeEls))el.classList.remove('dimmed','hi');
  for(const el of Object.values(edgeEls))el.classList.remove('dimmed','hi');
  renderPanel();
}
document.getElementById('btnTrace').onclick=()=>traceIdx<0?enterTrace():exitTrace();
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if(traceIdx>=0)exitTrace();else if(selId)select(null);}
  if(traceIdx>=0){
    if(ev.key==='ArrowRight'){ev.preventDefault();traceIdx<STEPS.length-1?(traceIdx++,applyTrace()):exitTrace();}
    if(ev.key==='ArrowLeft'&&traceIdx>0){ev.preventDefault();traceIdx--;applyTrace();}
  }
});

/* ───────────────────────── flow pulses ───────────────────────── */

const pulseG=document.getElementById('pulses');
const pulseDots=[];
for(const e of EDGES){
  if(e.kind!=='main')continue;
  const nd=Math.max(1,Math.floor(e._len/170));
  for(let i=0;i<nd;i++){
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r','2.6');c.setAttribute('class','pulse');
    pulseG.appendChild(c);
    pulseDots.push({e,off:i*(e._len/nd)+(e._len*.37)%60});
  }
}
function setFlowBtn(){document.getElementById('btnFlow').textContent=flowOn?'▶ Pause the flow':'▶ Resume the flow';}
document.getElementById('btnFlow').onclick=()=>{flowOn=!flowOn;pulseG.style.display=flowOn?'':'none';setFlowBtn();};
setFlowBtn();if(!flowOn)pulseG.style.display='none';
let last=0;
function tick(now){
  requestAnimationFrame(tick);
  if(!flowOn)return;
  const t=now/1000*44;
  let i=0;
  for(const c of pulseG.children){
    const p=pulseDots[i++];
    const q=edgePoint(p.e,(t+p.off)%p.e._len);
    c.setAttribute('cx',q[0].toFixed(1));c.setAttribute('cy',q[1].toFixed(1));
  }
}
requestAnimationFrame(tick);

/* ───────────────────────── boot ───────────────────────── */

document.getElementById('btnReset').onclick=()=>{
  if(traceIdx>=0)exitTrace();
  if(selId)select(null);
  fitView();
};
addEventListener('resize',()=>{ /* keep user view; refit only if never interacted? simple: refit if at home */ });
fitView();
renderPanel();
</script>
